                            next.allianceRequests = { ...next.allianceRequests, [rivalId]: 'accepted' };
                            next.rivals = next.rivals.map(r => r.id === rivalId ? { ...r, relation: Math.min(100, r.relation + 20) } : r);
                            addLog(`[同盟成立] ${rival.name} が共闘の要請に応じました！彼らの戦力が加算されます。`, "success");
                            setTimeout(() => {
                                setActionModal({ type: 'action_alliance', phase: 'result', message: `同盟成立！\n\n『${rival.name}』が共闘の要請に応じ、\n彼らの戦力が加算される！` });
                                setTimeout(() => setActionModal(null), 3500);
                            }, 0);
                        } else {
                            next.allianceRequests = { ...next.allianceRequests, [rivalId]: 'rejected' };
                            next.rivals = next.rivals.map(r => r.id === rivalId ? { ...r, relation: Math.max(0, r.relation - 10) } : r);
                            addLog(`[同盟拒否] ${rival.name} に要請をすげなく断られました。交渉決裂で関係が少し悪化しました...`, "danger");
                            setTimeout(() => {
                                setActionModal({ type: 'action_alliance', phase: 'result', message: `同盟拒否...\n\n要請はすげなく断られ、\n交渉は決裂した。` });
                                setTimeout(() => setActionModal(null), 3500);
                            }, 0);
                        }
                        return next;
                    });
                }, 2000);
            };

            const processTurn = () => {
                if (gameState.gameOver) return;
                GeminiAudio.playSE('click');

                let nextState = { ...gameState, turn: gameState.turn + 1, adventurers: [...gameState.adventurers.map(a => ({ ...a, history: [...a.history] }))], usedNames: [...gameState.usedNames], usedRepNames: [...gameState.usedRepNames] };
                let year = Math.floor(gameState.turn / 4) + 1;
                let season = SEASONS[gameState.turn % 4];

                let summaryItems = [];
                addLog(`--- 📜 第 ${year} 暦 【${season}】 ---`, "info");

                nextState.currentRumor = RUMORS[Math.floor(Math.random() * RUMORS.length)];

                if (nextState.receptionist.type === 'diplomat') {
                    nextState.rivals.forEach(r => r.relation = Math.min(100, r.relation + 3));
                    nextState.fame += 1;
                }

                // 受注済みクエストの進行と判定
                const active = [...nextState.activeQuests];
                nextState.activeQuests = []; // 一旦空にして、未完了のものだけ戻す
                
                active.forEach(q => {
                    const partyPowerObj = calculatePartyPower(nextState.mainParty, nextState);
                    const partyPower = partyPowerObj.total;
                    
                    // 成功判定 (戦力が足りていれば80%〜、不足していれば急減)
                    let pSuccess = Math.floor((partyPower / q.powerReq) * 80);
                    pSuccess = Math.min(95, Math.max(5, pSuccess));
                    
                    if (Math.random() * 100 < pSuccess) {
                        // 成功！
                        const guildCut = Math.floor(q.reward * 0.4);
                        const advCut = q.reward - guildCut;
                        
                        nextState.budget += guildCut;
                        nextState.townFavor = Math.min(100, nextState.townFavor + 5);
                        nextState.fame += 2;
                        
                        addLog(`[クエスト達成] 『${q.name}』を完遂！ ギルド手数料として ${guildCut}G を獲得しました。`, "success");
                        summaryItems.push({ type: 'success', text: `【クエスト達成】\n『${q.name}』を達成しました！\nギルド利益: ${guildCut}G / 報酬分配: ${advCut}G\n街の友好度が上昇しました。` });
                        
                        // 参加者に経験値（戦力上昇）
                        const mainAdvs = nextState.adventurers.filter(a => nextState.mainParty.includes(a.id));
                        mainAdvs.forEach(a => {
                            a.power += 2;
                            a.loyalty = Math.min(100, a.loyalty + 5);
                            a.history.unshift(`第 ${year} 暦 【${season}】: 依頼『${q.name}』を達成。`);
                        });
                    } else {
                        // 失敗（継続）
                        if (q.turnLimit > 1) {
                            addLog(`[継続中] 『${q.name}』は難航しており、次季に持ち越されました。`, "warning");
                            nextState.activeQuests.push({ ...q, turnLimit: q.turnLimit - 1 });
                        } else {
                            addLog(`[不履行] 『${q.name}』は失敗に終わりました。街の信頼を失いました。`, "danger");
                            nextState.townFavor = Math.max(0, nextState.townFavor - 15);
                            summaryItems.push({ type: 'fail', text: `【クエスト失敗】\n『${q.name}』を達成できず、期限が切れました。\n街の友好度が大幅に低下しました。` });
                        }
                    }
                });

                const myDefInt = getDefenseIntelligence(nextState);

                nextState.rivals.forEach(rival => {
                    let interfereChance = 0.10 + ((100 - rival.relation) / 200);
                    if (Math.random() < interfereChance && rival.relation < 80) {

                        if (Math.random() * 100 < myDefInt) {
                            summaryItems.push({ type: 'info', text: `【防諜成功】『${rival.name}』の工作員の接近を事前に察知し、未然に防ぎました！` });
                            addLog(`[防諜] 『${rival.name}』の干渉を防ぎました。`, "success");
                            return;
                        }

                        if (rival.style === 'military') {
                            if (Math.random() < 0.5 && nextState.adventurers.length > 0) {
                                let victim = nextState.adventurers[Math.floor(Math.random() * nextState.adventurers.length)];
                                victim.power = Math.max(1, Math.floor(victim.power * 0.8));
                                victim.loyalty -= 10;
                                victim.history.unshift(`第 ${year} 暦 【${season}】: 敵対する『${rival.name}』の襲撃を受け負傷。`);
                                summaryItems.push({ type: 'danger', text: `【敵襲】関係が悪化した『${rival.name}』の襲撃！\n${victim.name} が負傷し戦力が低下しました。` });
                                rival.relation = Math.max(0, rival.relation - 10);
                            } else {
                                let stolen = Math.floor(Math.random() * 300) + 100;
                                nextState.budget -= stolen;
                                summaryItems.push({ type: 'warning', text: `【強奪】関係が悪化した『${rival.name}』の嫌がらせにより、物資が強奪され ${stolen}G の損失が出ました。` });
                            }
                        } else if (rival.style === 'commerce') {
                            let stolen = Math.floor(Math.random() * 500) + 200;
                            nextState.budget -= stolen;
                            summaryItems.push({ type: 'warning', text: `【商業妨害】『${rival.name}』の悪質な価格競争と顧客引き抜きにより、${stolen}G の損失が出ました。` });
                            rival.relation = Math.max(0, rival.relation - 5);
                        } else if (rival.style === 'safety') {
                            if (nextState.fame > 10) {
                                let fameLoss = Math.floor(Math.random() * 5) + 2;
                                nextState.fame -= fameLoss;
                                summaryItems.push({ type: 'warning', text: `【政治工作】『${rival.name}』が街の有力者に根回しを行い、我がギルドの名声が ${fameLoss} 低下しました。` });
                            }
                        }

                        if (Math.random() < 0.2 && nextState.adventurers.length > 0) {
                            let lowLoyaltyAdvs = nextState.adventurers.filter(a => a.loyalty < 50);
                            if (lowLoyaltyAdvs.length > 0) {
                                let traitor = lowLoyaltyAdvs[Math.floor(Math.random() * lowLoyaltyAdvs.length)];
                                summaryItems.push({ type: 'leave', text: `【裏切り】忠誠の低かった ${traitor.name} が、敵対する『${rival.name}』に引き抜かれて寝返りました！` });
                                nextState.adventurers = nextState.adventurers.filter(a => a.id !== traitor.id);
                                nextState.mainParty = nextState.mainParty.filter(id => id !== traitor.id);
                                rival.power += traitor.power;
                                traitor.history.unshift(`第 ${year} 暦 【${season}】: 『${rival.name}』の引き抜きに応じ、元のギルドを裏切った。`);
                                rival.members.push(traitor);
                            }
                        }
                    }
                });

                const rivalGrowth = Math.floor(20 + nextState.turn * 1.5);
                nextState.rivals = nextState.rivals.map(r => ({ ...r, power: r.power + Math.floor(Math.random() * rivalGrowth) + Math.floor(rivalGrowth / 2) }));

                // ライバル同士の抗争
                if (nextState.rivals.length >= 2 && Math.random() < 0.4) {
                    let r1 = nextState.rivals[Math.floor(Math.random() * nextState.rivals.length)];
                    let others = nextState.rivals.filter(r => r.id !== r1.id);
                    let r2 = others[Math.floor(Math.random() * others.length)];
                    
                    if (r1.type === 'cunning' && Math.random() < 0.7) {
                        const dmg = Math.floor(r2.power * 0.15);
                        r2.power = Math.max(0, r2.power - dmg);
                        r1.power += Math.floor(dmg * 0.5);
                        summaryItems.push({ type: 'warning', text: `【噂】暗躍する『${r1.name}』が『${r2.name}』の拠点を襲撃し、物資を強奪したらしい…（${r2.name}の戦力が低下）` });
                    } else if (r1.type === 'giant' && Math.random() < 0.6) {
                        const dmg = Math.floor(r2.power * 0.2);
                        r2.power = Math.max(0, r2.power - dmg);
                        summaryItems.push({ type: 'event', text: `【噂】大手ギルド『${r1.name}』が『${r2.name}』を武力で圧倒し、縄張りを奪ったようだ…（${r2.name}の戦力が低下）` });
                    } else if (Math.random() < 0.3) {
                        if (r2.members.length > 0) {
                            let stolenIdx = Math.floor(Math.random() * r2.members.length);
                            let stolen = r2.members[stolenIdx];
                            r2.members.splice(stolenIdx, 1);
                            r2.power = Math.max(0, r2.power - stolen.power);
                            r1.members.push(stolen);
                            r1.power += stolen.power;
                            summaryItems.push({ type: 'info', text: `【噂】『${r1.name}』が『${r2.name}』から有能な冒険者を引き抜いたらしい。` });
                        }
                    }
                }

                let retiredAdvs = [];
                nextState.adventurers.forEach(a => {
                    a.age += 0.25;
                    if (a.age >= 40) {
                        let retireChance = (a.age - 39) * 0.05;
                        if (a.age >= 50) retireChance = 1.0;
                        if (Math.random() < retireChance) retiredAdvs.push(a);
                    }
                });

                retiredAdvs.forEach(retA => {
                    nextState.adventurers = nextState.adventurers.filter(a => a.id !== retA.id);
                    nextState.mainParty = nextState.mainParty.filter(id => id !== retA.id);
                    if (retA.equippedArtifactId) {
                        nextState.ownedArtifacts.push(retA.equippedArtifactId);
                    }

                    if (nextState.adventurers.length > 0) {
                        let heirs = [...nextState.adventurers].sort((a, b) => a.age - b.age);
                        let heir = heirs[0];
                        let inheritedPower = Math.floor(retA.power * 0.3);
                        heir.power += inheritedPower;
                        heir.history.unshift(`第 ${year} 暦 【${season}】: 引退した歴戦の勇士 ${retA.name} から想いを継承し、戦力が ${inheritedPower} 上昇した。`);
                        summaryItems.push({ type: 'info', text: `【世代交代】\n歴戦の勇士 ${retA.name} が年齢(${Math.floor(retA.age)}歳)のため引退しました。\nその技と想いは若き ${heir.name} へと受け継がれました。` });
                    } else {
                        summaryItems.push({ type: 'info', text: `【引退】\n歴戦の勇士 ${retA.name} が年齢(${Math.floor(retA.age)}歳)のため引退し、静かな余生に入りました。` });
                    }
                });

                // 死亡・引退・寝返りにより部隊が減っている場合、自動で補充を試みる。
                // （おまかせ編成はプレイヤー自身が押すものとし、ここでは単にリストに残っているメンバーを維持する）
                nextState.mainParty = nextState.mainParty.filter(id => nextState.adventurers.some(a => a.id === id));

                let totalSalary = nextState.adventurers.reduce((sum, a) => sum + a.salary, 0);
                totalSalary += nextState.receptionist.salary;
                let baseMaintenance = nextState.facilities.residence * 100 + nextState.facilities.tavern * 50 + nextState.facilities.training * 50;

                let discount = Math.min(0.5, nextState.shops.itemShop * 0.1);
                if (nextState.receptionist.type === 'merchant') discount = Math.min(0.5, discount + 0.1);
                if (nextState.masterSkills.business > 0) discount = Math.min(0.8, discount + (nextState.masterSkills.business * 0.1));

                let maintenance = Math.floor(baseMaintenance * (1 - discount));

                const reserveCount = nextState.adventurers.length - nextState.mainParty.length;
                let reserveBase = 20;
                if (nextState.masterSkills.business > 0) reserveBase += (nextState.masterSkills.business * 10);
                let reserveIncome = reserveCount * reserveBase;

                nextState.budget -= (totalSalary + maintenance);
                nextState.budget += reserveIncome;
                addLog(`四半期の給与(受付含む)・維持費 ${totalSalary + maintenance}G を支払いました。${discount > 0 ? `(支援等で ${baseMaintenance - maintenance}G 節約)` : ''}`, "normal");
                if (reserveIncome > 0) addLog(`待機中の冒険者 ${reserveCount} 名が街で雑用をこなし、${reserveIncome}G を稼ぎました。`, "info");

                if (nextState.budget < 0) {
                    addLog("[危急] 金庫が空です！ 給与未払いで冒険者たちの不満が爆発寸前です。", "danger");
                    summaryItems.push({ type: 'danger', text: `金庫が空です！給与未払いで冒険者たちの不満が爆発寸前です。` });
                    nextState.adventurers.forEach(a => {
                        let loss = a.trait.id === 'loyal' ? 5 : a.trait.id === 'greedy' ? 30 : 20;
                        a.loyalty -= loss;
                    });
                }

                let commerceIncome = Math.floor(nextState.facilities.tavern * 300 * (nextState.alignment.commerce / 25));
                if (nextState.masterSkills.business > 0) commerceIncome = Math.floor(commerceIncome * (1 + nextState.masterSkills.business * 0.2));

                if (activeEvent?.type === 'BOOM') commerceIncome *= 2;
                if (activeEvent?.type === 'RECESSION') commerceIncome = Math.floor(commerceIncome / 2);
                if (commerceIncome > 0) {
                    nextState.budget += commerceIncome;
                    addLog(`[商業] 宿屋・酒場の営業収益として ${commerceIncome}G が金庫に納められました。`, "success");
                }

                let incomeText = `給与・維持費として ${totalSalary + maintenance}G を支出しました。`;
                if (commerceIncome > 0 || reserveIncome > 0) incomeText += `\n商業・内政により計 ${commerceIncome + reserveIncome}G を獲得しました。`;
                summaryItems.push({ type: 'finance', text: incomeText });

                const { total: partyPower, warnings: partyWarnings } = calculatePartyPower(nextState.mainParty, nextState);
                if (partyWarnings.length > 0 && nextState.mainParty.length > 0) {
                    summaryItems.push({ type: 'warning', text: `作戦部隊内で問題発生:\n${partyWarnings.join('\n')}` });
                }

                if (nextState.mainParty.length === 0 && !nextState.targetDungeon) {
                    addLog("[警告] 作戦部隊が編成できなかったため、今季の任務は行われませんでした。", "warning");
                    summaryItems.push({ type: 'warning', text: `作戦部隊が編成されていなかったため、任務は行われませんでした。` });
                } else if (nextState.targetDungeon && nextState.mainParty.length > 0) {
                    const dungeon = nextState.discoveredDungeons.find(d => d.id === nextState.targetDungeon);
                    let pSuccessBase = (partyPower / dungeon.powerReq) * 80;

                    const mainAdvs = nextState.adventurers.filter(a => nextState.mainParty.includes(a.id));
                    const thiefCount = mainAdvs.filter(a => a.advClass.id === 'thief').length;
                    const clericCount = mainAdvs.filter(a => a.advClass.id === 'cleric').length;
                    pSuccessBase += (thiefCount * 10);
                    pSuccessBase += (nextState.shops.blacksmith * 5);

                    let pSuccess = Math.floor(Math.min(95, Math.max(5, pSuccessBase)));
                    let isSuccess = (Math.random() * 100) <= pSuccess;

                    addLog(`[迷宮] 作戦部隊が『${dungeon.name}』の攻略に挑みます... (成功予測: ${pSuccess}%)`, "info");

                    if (isSuccess) {
                        nextState.budget += dungeon.reward;
                        nextState.fame += 10;
                        nextState.clearedDungeons.push(dungeon.id);
                        nextState.discoveredDungeons = nextState.discoveredDungeons.filter(d => d.id !== dungeon.id);
                        nextState.targetDungeon = null;
                        addLog(`[攻略成功] 見事『${dungeon.name}』を踏破しました！ 報酬 ${dungeon.reward}G を獲得！`, "success");
                        summaryItems.push({ type: 'success', text: `迷宮『${dungeon.name}』の攻略に成功しました！\n莫大な財宝 ${dungeon.reward}G を獲得しました。` });

                        const availableArtifacts = ARTIFACT_POOL.filter(art =>
                            !nextState.ownedArtifacts.includes(art.id) &&
                            !nextState.adventurers.some(a => a.equippedArtifactId === art.id)
                        );
                        if (availableArtifacts.length > 0 && Math.random() < 0.6) {
                            let drop = availableArtifacts[Math.floor(Math.random() * availableArtifacts.length)];
                            nextState.ownedArtifacts.push(drop.id);
                            addLog(`[発掘] 迷宮の奥底で古代の遺物『${drop.name}』を発見しました！`, "info");
                            summaryItems.push({ type: 'hero', text: `【遺物発見】\n古代の遺物『${drop.name}』を発見しました！冒険者に授与できます。` });
                        }

                        const powerCap = { E: 50, D: 80, C: 120, B: 180, A: 250, S: 400 };
                        mainAdvs.forEach(a => {
                            const growth = nextState.facilities.training * 3;
                            const cap = powerCap[a.rank] || 999;
                            a.power = Math.min(cap, a.power + growth);
                            a.history.unshift(`第 ${year} 暦 【${season}】: 迷宮『${dungeon.name}』を見事踏破した。`);
                        });
                    } else {
                        addLog(`[攻略失敗] 『${dungeon.name}』の奥深くで部隊は壊滅しました...`, "danger");
                        summaryItems.push({ type: 'fail', text: `迷宮『${dungeon.name}』の攻略に失敗しました。部隊は命からがら逃げ帰りました...` });

                        let victimIdx = Math.floor(Math.random() * mainAdvs.length);
                        let victim = mainAdvs[victimIdx];
                        let deathRate = 0.4 - (nextState.shops.magicShop * 0.05) - (clericCount > 0 ? 0.1 : 0);
                        if (victim.trait.id === 'coward') deathRate -= 0.15;

                        if (Math.random() < deathRate) {
                            addLog(`[訃報] 痛ましいことに、${victim.name} は迷宮から生還しませんでした...`, "danger");
                            summaryItems.push({ type: 'death', text: `${victim.name} が迷宮の罠に倒れ、帰らぬ人となりました。` });
                            nextState.adventurers = nextState.adventurers.filter(a => a.id !== victim.id);
                            nextState.mainParty = nextState.mainParty.filter(id => id !== victim.id);
                            if (victim.equippedArtifactId) nextState.ownedArtifacts.push(victim.equippedArtifactId);
                        } else {
                            victim.power = Math.max(1, Math.floor(victim.power * 0.7));
                            victim.loyalty -= 20;
                            victim.history.unshift(`第 ${year} 暦 【${season}】: 迷宮探索で重傷を負い撤退。`);
                        }
                    }
                } else if (nextState.mainParty.length > 0) {
                    const mainAdvs = nextState.adventurers.filter(a => nextState.mainParty.includes(a.id));
                    let roll = Math.random() * 100;
                    let cumulative = 0;
                    let questType = 'safety';
                    for (let a of ALIGNMENTS) {
                        cumulative += nextState.alignment[a];
                        if (roll <= cumulative) { questType = a; break; }
                    }

                    if (questType === 'commerce') {
                        addLog("[方針] 今季は街での商売と内政に注力し、危険な遠征は控えました。", "normal");
                        summaryItems.push({ type: 'info', text: `今季は街での商売と内政に注力し、危険な遠征は控えました。` });
                    } else {
                        let gBonus = nextState.alignment[questType] / 25;
                        let qDiff = 30 + (nextState.turn * 4.5);
                        let pSuccessBase = (partyPower * gBonus / qDiff) * 100;

                        const thiefCount = mainAdvs.filter(a => a.advClass.id === 'thief').length;
                        const clericCount = mainAdvs.filter(a => a.advClass.id === 'cleric').length;
                        const heroicCount = mainAdvs.filter(a => a.trait.id === 'heroic').length;

                        if (questType === 'adventure') pSuccessBase += (thiefCount * 10);
                        if (questType === 'safety') pSuccessBase += (clericCount * 10);
                        pSuccessBase += (heroicCount * 5);
                        pSuccessBase += (nextState.shops.blacksmith * 5);

                        let pSuccess = Math.floor(Math.min(95, Math.max(5, pSuccessBase)));
                        let isSuccess = (Math.random() * 100) <= pSuccess;

                        let rewardBase = Math.floor(qDiff * 10 + (nextState.turn * 15)); // 報酬のインフレを抑える
                        const typeLabel = questType === 'safety' ? '街の治安維持' : questType === 'adventure' ? '未開の地の探索' : '他領への軍事侵攻';
                        addLog(`[出撃] 作戦部隊が『${typeLabel}』へ出立！... (成功予測: ${pSuccess}%)`, "info");

                        if (isSuccess) {
                            let reward = rewardBase;
                            if (questType === 'military') reward = Math.floor(reward * 1.5);
                            if (questType === 'safety') reward = Math.floor(reward * 0.7);

                            if (activeEvent?.type === 'MONSTER_STAMPEDE' && questType === 'safety') reward *= 2;
                            if (activeEvent?.type === 'WAR' && questType === 'military') reward *= 2;

                            nextState.budget += reward;
                            addLog(`[戦果] 任務は見事成功！ 報酬の金貨 ${reward}G を持ち帰りました。`, "success");
                            summaryItems.push({ type: 'success', text: `『${typeLabel}』の任務に見事成功！\n報酬 ${reward}G を獲得しました。` });

                            if (questType === 'safety') { nextState.fame += 3; nextState.notoriety = Math.max(0, nextState.notoriety - 1); }
                            if (questType === 'adventure') { nextState.fame += 2; }
                            if (questType === 'military') { nextState.notoriety += 6; nextState.fame += 1; }

                            mainAdvs.forEach(a => a.power += nextState.facilities.training);

                            if (Math.random() < 0.3 && mainAdvs.length > 0) {
                                const hero = mainAdvs[Math.floor(Math.random() * mainAdvs.length)];
                                hero.history.unshift(`第 ${year} 暦 【${season}】: ${typeLabel}の任務において卓越した武勲を立てた。`);
                                hero.influence += 5;
                                summaryItems.push({ type: 'hero', text: `${hero.name} が任務で大活躍し、武勲を立てました！` });
                            }

                        } else {
                            addLog(`[悲報] 任務は凄惨たる失敗に終わりました。部隊は命からがら撤退しました...`, "danger");
                            summaryItems.push({ type: 'fail', text: `『${typeLabel}』の任務は凄惨たる失敗に終わりました...` });

                            if (questType === 'military') nextState.notoriety += 2;
                            if (questType === 'safety') nextState.fame = Math.max(0, nextState.fame - 2);

                            let victimIdx = Math.floor(Math.random() * mainAdvs.length);
                            let victim = mainAdvs[victimIdx];

                            let deathRate = 0.3;
                            deathRate -= (nextState.shops.magicShop * 0.05);
                            if (victim.trait.id === 'coward') deathRate -= 0.15;
                            if (clericCount > 0) deathRate -= 0.05;
                            if (activeEvent?.type === 'WAR' && questType === 'military') deathRate += 0.3;
                            if (activeEvent?.type === 'MONSTER_STAMPEDE' && questType === 'safety') deathRate += 0.2;

                            if (Math.random() < deathRate) {
                                addLog(`[訃報] 痛ましいことに、${victim.name} は生きて帰ることはありませんでした...`, "danger");
                                summaryItems.push({ type: 'death', text: `痛ましいことに、${victim.name} は生きて帰ることはありませんでした。` });
                                nextState.adventurers = nextState.adventurers.filter(a => a.id !== victim.id);
                                nextState.mainParty = nextState.mainParty.filter(id => id !== victim.id);
                                if (victim.equippedArtifactId) nextState.ownedArtifacts.push(victim.equippedArtifactId);
                            } else {
                                addLog(`[負傷] ${victim.name} が深手を負いました。実力と忠誠が低下します。`, "warning");
                                summaryItems.push({ type: 'injury', text: `${victim.name} が任務中に深手を負いました。` });
                                victim.power = Math.max(1, Math.floor(victim.power * 0.8));
                                victim.loyalty -= 15;
                                victim.history.unshift(`第 ${year} 暦 【${season}】: 任務失敗により重傷を負う。`);
                            }
                        }
                    }

                    if (Math.random() * 100 < nextState.alignment.adventure * 0.8) {
                        const availableDungeons = DUNGEON_POOL.filter(d =>
                            !nextState.discoveredDungeons.some(dd => dd.id === d.id) &&
                            !nextState.clearedDungeons.includes(d.id)
                        );
                        if (availableDungeons.length > 0) {
                            const found = availableDungeons[0];
                            nextState.discoveredDungeons.push(found);
                            addLog(`[発見] 探索の過程で新たな迷宮『${found.name}』を発見しました！`, "info");
                            summaryItems.push({ type: 'info', text: `未知の迷宮『${found.name}』を発見しました！\n「未踏の迷宮」から次季の目標に設定できます。` });
                        }
                    }
                }

                for (let i = nextState.adventurers.length - 1; i >= 0; i--) {
                    let a = nextState.adventurers[i];
                    if (nextState.budget > 0 && a.loyalty < 100) {
                        let rec = (a.trait.id === 'loyal' ? 5 : 2);
                        if (nextState.masterSkills.charisma > 0) rec += (nextState.masterSkills.charisma * 2);
                        a.loyalty = Math.min(100, a.loyalty + rec);
                    }
                    if (a.loyalty <= 0) {
                        addLog(`[決別] 愛想を尽かした ${a.name} が、ギルドの紋章を投げ捨てて去っていきました。`, "danger");
                        summaryItems.push({ type: 'leave', text: `愛想を尽かした ${a.name} が自発的にギルドを去っていきました。` });
                        if (a.equippedArtifactId) nextState.ownedArtifacts.push(a.equippedArtifactId);
                        nextState.adventurers.splice(i, 1);
                        nextState.mainParty = nextState.mainParty.filter(id => id !== a.id);
                    }
                }

                let maxRoster = nextState.facilities.residence * 5;
                if (nextState.adventurers.length < maxRoster) {
                    const isRecruiter = nextState.receptionist.type === 'recruiter';
                    const joinChance = (nextState.fame / 5) + 20 + (isRecruiter ? 15 : 0);

                    if (Math.random() * 100 < joinChance) {
                        let newAdv = generateAdventurer(nextState.fame, nextState.notoriety, nextState.usedNames, null, isRecruiter);
                        nextState.adventurers.push(newAdv);
                        nextState.usedNames.push(newAdv.name);
                        addLog(`[来訪] ギルドの噂を聞きつけ、${newAdv.name} (ランク${newAdv.rank}・${newAdv.advClass.name}) が門を叩きました！`, "success");
                        summaryItems.push({ type: 'join', text: `新たな冒険者 ${newAdv.name} (ランク${newAdv.rank}) が加入しました！` });
                    }
                }

                if (!nextState.specialRequest && !nextState.activeBoss && Math.random() < 0.2) {
                    nextState.specialRequest = SPECIAL_REQUESTS[Math.floor(Math.random() * SPECIAL_REQUESTS.length)];
                    addLog(`[至急] ギルドに特別な指名依頼が舞い込みました。本部で確認してください。`, "accent");
                }

                checkAchievements(nextState, summaryItems);

                if (nextState.turn >= MAX_TURNS) {
                    nextState.gameOver = true; nextState.endType = "TIME_UP";
                } else if (nextState.budget < -5000) {
                    nextState.gameOver = true; nextState.endType = "BANKRUPT";
                } else if (nextState.adventurers.length === 0 && nextState.budget < 1000) {
                    nextState.gameOver = true; nextState.endType = "RUIN";
                }

                if (BOSS_DATA[nextState.turn]) {
                    nextState.activeBoss = { ...BOSS_DATA[nextState.turn] };
                    nextState.allianceRequests = {};
                    nextState.specialRequest = null;
                    summaryItems.push({ type: 'danger', text: `【緊急事態】\n${nextState.activeBoss.name}が迫っています！次季は全勢力を挙げて迎撃にあたります。` });
                }

                setQuarterResult({
                    year, season, items: summaryItems,
                    budget: nextState.budget, fame: nextState.fame, notoriety: nextState.notoriety,
                    isGameOver: nextState.gameOver
                });

                setSelectedCandidate(null);
                setGameState(nextState);
            };

            const fightBoss = () => {
                let nextState = { ...gameState, turn: gameState.turn + 1, adventurers: [...gameState.adventurers.map(a => ({ ...a, history: [...a.history] }))] };
                let summaryItems = [];
                let year = Math.floor(gameState.turn / 4) + 1;
                let season = SEASONS[gameState.turn % 4];

                addLog(`--- 🚨 厄災討伐戦 【${nextState.activeBoss.name}】 ---`, "danger");

                let finalPowerBase = nextState.adventurers.reduce((sum, a) => {
                    let p = a.power;
                    if (a.equippedArtifactId) {
                        const art = ARTIFACT_POOL.find(art => art.id === a.equippedArtifactId);
                        if (art) p += art.powerBonus;
                    }
                    return sum + p;
                }, 0);

                let allyPower = 0;
                Object.keys(nextState.allianceRequests).forEach(rId => {
                    if (nextState.allianceRequests[rId] === 'accepted') {
                        const rival = nextState.rivals.find(r => r.id === rId);
                        if (rival) allyPower += rival.power;
                    }
                });

                let finalPower = finalPowerBase + allyPower;
                let winRate = Math.min(95, Math.floor((finalPower / nextState.activeBoss.power) * 100));
                let isSuccess = (Math.random() * 100) <= winRate;

                if (isSuccess) {
                    addLog(`[討伐成功] ${nextState.activeBoss.name}の討伐に成功しました！`, "success");
                    summaryItems.push({ type: 'hero', text: `【厄災討伐成功】\n凄絶な戦いの末、${nextState.activeBoss.name}を討ち果たしました！` });

                    let myReward = nextState.activeBoss.reward;
                    let allyCount = Object.values(nextState.allianceRequests).filter(v => v === 'accepted').length;
                    if (allyCount > 0) {
                        myReward = Math.floor(myReward / (allyCount + 1));
                        summaryItems.push({ type: 'info', text: `共闘した他ギルドと報酬を分配し、${myReward}G を獲得しました。` });
                        if (!nextState.unlockedAchievements.includes('coop')) {
                            nextState.unlockedAchievements.push('coop');
                            summaryItems.push({ type: 'event', text: `🏆 実績解除: 呉越同舟` });
                        }
                        nextState.rivals = nextState.rivals.map(r =>
                            nextState.allianceRequests[r.id] === 'accepted' ? { ...r, relation: Math.min(100, r.relation + 30) } : r
                        );
                    } else {
                        summaryItems.push({ type: 'finance', text: `報酬 ${myReward}G を独占しました！` });
                    }
                    nextState.budget += myReward;
                    nextState.fame += 50;

                    const availableArtifacts = ARTIFACT_POOL.filter(art =>
                        !nextState.ownedArtifacts.includes(art.id) &&
                        !nextState.adventurers.some(a => a.equippedArtifactId === art.id)
                    );
                    if (availableArtifacts.length > 0) {
                        let drop = availableArtifacts[Math.floor(Math.random() * availableArtifacts.length)];
                        nextState.ownedArtifacts.push(drop.id);
                        addLog(`[発掘] 厄災の残骸から古代の遺物『${drop.name}』を発見しました！`, "info");
                        summaryItems.push({ type: 'hero', text: `【遺物発見】\n厄災の残骸から古代の遺物『${drop.name}』を発見しました！` });
                    }

                    if (!nextState.unlockedAchievements.includes(nextState.activeBoss.id)) {
                        nextState.unlockedAchievements.push(nextState.activeBoss.id);
                        summaryItems.push({ type: 'event', text: `🏆 実績解除: ${ACHIEVEMENTS.find(a => a.id === nextState.activeBoss.id)?.name}` });
                    }
                } else {
                    addLog(`[討伐失敗] ${nextState.activeBoss.name}の前に敗北しました...甚大な被害が出ています。`, "danger");
                    summaryItems.push({ type: 'fail', text: `【厄災討伐失敗】\n我々の力は及びませんでした。街は破壊され、ギルドにも甚大な被害が出ています。` });

                    nextState.fame = Math.max(0, nextState.fame - 50);
                    nextState.budget -= Math.floor(nextState.budget * 0.5);

                    const survivors = [];
                    nextState.adventurers.forEach(adv => {
                        if (Math.random() < 0.4) {
                            summaryItems.push({ type: 'death', text: `${adv.name} が厄災との戦いで散りました...` });
                            nextState.mainParty = nextState.mainParty.filter(id => id !== adv.id);
                            if (adv.equippedArtifactId) nextState.ownedArtifacts.push(adv.equippedArtifactId);
                        } else {
                            adv.power = Math.max(1, Math.floor(adv.power * 0.7));
                            adv.loyalty -= 30;
                            adv.history.unshift(`第 ${year} 暦 【${season}】: 厄災との戦いで重傷を負う。生き延びただけ幸運だった。`);
                            survivors.push(adv);
                        }
                    });
                    nextState.adventurers = survivors;
                }

                nextState.rivals = nextState.rivals.map(r => ({ ...r, power: r.power + Math.floor(Math.random() * 40) + 10 }));
                nextState.activeBoss = null;
                nextState.allianceRequests = {};

                checkAchievements(nextState, summaryItems);

                if (nextState.turn >= MAX_TURNS) {
                    nextState.gameOver = true; nextState.endType = "TIME_UP";
                } else if (nextState.budget < -5000) {
                    nextState.gameOver = true; nextState.endType = "BANKRUPT";
                } else if (nextState.adventurers.length === 0 && nextState.budget < 1000) {
                    nextState.gameOver = true; nextState.endType = "RUIN";
                }

                setQuarterResult({
                    year, season, items: summaryItems,
                    budget: nextState.budget, fame: nextState.fame, notoriety: nextState.notoriety,
                    isGameOver: nextState.gameOver
                });
                setGameState(nextState);
                setCurrentView('home');
            };

            const sellGuild = () => {
                if (window.confirm("ギルドの権利書を商会に売り渡し、冒険の第一線から退きますか？（ゲーム終了）")) {
                    let facilityValue = gameState.facilities.residence * 1000 + gameState.facilities.tavern * 1500 + gameState.facilities.training * 2000;
                    let multiplier = Math.max(0.1, 1 + (gameState.fame - gameState.notoriety) / 100);
                    let saleValue = Math.floor((Math.max(0, gameState.budget) + facilityValue) * multiplier);
                    setGameState(prev => ({ ...prev, gameOver: true, endType: "SELL", endData: saleValue }));
                }
            };

            const usurpThrone = () => {
                const currentPartyPower = calculatePartyPower(gameState.mainParty, gameState).total;
                if (currentPartyPower < 1000) return addLog("[無謀] 王城を落とすには現在の主力部隊の戦力がまるで足りません！（推定戦力1000以上必要）", "danger");

                let successRate = Math.min(95, (currentPartyPower / 2000) * 100);
                if (Math.random() * 100 < successRate) setGameState(prev => ({ ...prev, gameOver: true, endType: "USURP_WIN" }));
                else setGameState(prev => ({ ...prev, gameOver: true, endType: "USURP_LOSE" }));
            };

            const getReputationText = () => {
                if (gameState.fame > 100 && gameState.notoriety < 20) return "街の住人から絶大な信頼を寄せられる、誇り高き英雄の集団として讃えられています。";
                if (gameState.notoriety > 100 && gameState.fame < 50) return "裏社会を牛耳る悪名高い暗黒組織として、人々から恐れられています。";
                if (gameState.fame > 100 && gameState.notoriety > 100) return "清濁併せ呑む強大な派閥として、権力者すら畏怖する存在です。";
                return "数あるギルドの一つとして、日々堅実に依頼をこなし街に溶け込んでいます。";
            };

            const renderEnding = () => {
                if (!gameState.gameOver || quarterResult) return null;

                let title = "", desc = "", colorClass = "text-amber-500", bgClass = "bg-[#2A241F]", borderClass = "border-[#D4C3A3]";

                if (gameState.endType === "SELL") {
                    title = "伝説の商人";
                    desc = `あなたは権利書を ${gameState.endData.toLocaleString()} G で巨大商会に売却しました。血みどろの戦場から身を退き、莫大な富と共に優雅な余生を送ります。見事な手腕でした。`;
                } else if (gameState.endType === "TIME_UP") {
                    title = "三十年の叙事詩";
                    desc = `30年の勅許期間が終了しました。最終金庫: ${gameState.budget.toLocaleString()}G | 名声: ${gameState.fame} | 悪名: ${gameState.notoriety}。あなたの築き上げたギルドは、吟遊詩人によって長く語り継がれるでしょう。`;
                } else if (gameState.endType === "BANKRUPT") {
                    title = "巨額の負債"; colorClass = "text-rose-600";
                    desc = `取り立て屋がギルドを包囲しました。全資産は差し押さえられ、あなたは窓一つない債務者監獄の冷たい石床の上で余生を過ごすことになります。`;
                } else if (gameState.endType === "RUIN") {
                    title = "静寂の広間"; colorClass = "text-stone-400";
                    desc = `冒険者の姿はなく、金庫の底も見えました。ギルドの扉には板が打ち付けられ、あなたは失敗した設立者として歴史の闇へと消えていきます。`;
                } else if (gameState.endType === "USURP_WIN") {
                    title = "玉座の簒奪者"; colorClass = "text-purple-500";
                    desc = `あなたの部隊は王都を蹂躙し、玉座を血で染め上げました。ギルドが法となり、あなたが絶対的な覇王となる、新たなる暗黒時代の幕開けです。`;
                } else if (gameState.endType === "USURP_LOSE") {
                    title = "反逆者の末路"; colorClass = "text-rose-600";
                    desc = `王国の精鋭騎士団の前に、部隊は無残に散りました。ギルドマスターであるあなたと同胞たちは、中央広場で群衆の嘲笑を浴びながら断頭台の露と消えました。`;
                }

                return (
                    <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4 font-serif">
                        <div className={`${bgClass} border-4 ${borderClass} rounded-sm p-10 max-w-2xl w-full text-center shadow-2xl relative overflow-hidden animate-in fade-in zoom-in duration-500`}>
                            <div className="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-[#D4C3A3]"></div>
                            <div className="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-[#D4C3A3]"></div>
                            <div className="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-[#D4C3A3]"></div>
                            <div className="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-[#D4C3A3]"></div>
                            {(() => {
                                const endImages = {
                                    SELL: 'assets/images/end_sell.png',
                                    TIME_UP: 'assets/images/end_timeup.png',
                                    BANKRUPT: 'assets/images/end_bankrupt.png',
                                    RUIN: 'assets/images/end_ruin.png',
                                    USURP_WIN: 'assets/images/end_usurp_win.png',
                                    USURP_LOSE: 'assets/images/end_usurp_lose.png'
                                };
                                const imgSrc = endImages[gameState.endType];
                                return imgSrc ? <img src={imgSrc} className="ending-image mb-6" alt={title} /> : <Crown className={`w-24 h-24 mx-auto mb-6 ${colorClass}`} strokeWidth={1.5} />;
                            })()}
                            <h1 className={`text-4xl md:text-5xl font-bold mb-8 ${colorClass} tracking-widest text-readable-dark`}>{title}</h1>
                            <p className="text-[#E8E0D5] text-lg leading-relaxed mb-10 text-justify"><TypewriterText text={desc} speed={30} onComplete={() => {
                                setTimeout(() => {
                                    const btn = document.getElementById('ending-restart-btn');
                                    if (btn) btn.style.opacity = '1';
                                }, 300);
                            }} /></p>
                            <button id="ending-restart-btn" onClick={resetGame} style={{ opacity: 0, transition: 'opacity 1s ease-in' }} className="bg-[#D4C3A3] hover:bg-[#E8E0D5] text-stone-900 px-8 py-3 font-bold text-lg transition-colors border border-stone-600 shadow-[inset_0_0_10px_rgba(0,0,0,0.2)] uppercase tracking-wider">
                                新たな歴史を紡ぐ
                            </button>
                        </div>
                    </div>
                );
            };

            const renderSpecialRequestModal = () => {
                if (!reqModalOpen) return null;
                const { total: reqPower, warnings } = calculatePartyPower(reqParty, gameState);

                return (
                    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 font-serif backdrop-blur-sm animate-in fade-in duration-200">
                        <div className="bg-[#FAF8F5] border-2 border-[#D4C3A3] rounded-sm max-w-2xl w-full shadow-2xl relative flex flex-col max-h-[90vh]">
                            <div className="p-4 border-b border-[#D4C3A3] bg-[#E8E0D5]">
                                <h2 className="text-xl font-bold text-stone-800 flex items-center gap-2"><Target className="w-6 h-6 text-indigo-700" /> 特別指名依頼 部隊編成</h2>
                                <p className="text-sm text-stone-600 mt-1">ギルドマスターの権限で、今回出撃するメンバーを直接指示してください。（最大5名）</p>
                            </div>

                            <div className="p-4 bg-white border-b border-stone-200 flex justify-between items-center shrink-0">
                                <div>
                                    <div className="text-xs text-stone-500 font-bold">目標: {gameState.specialRequest.name}</div>
                                    <div className="text-sm font-bold text-rose-600">推奨戦力: {gameState.specialRequest.powerReq}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-xs text-stone-500 font-bold">現在の編成戦力 (相性補正込み)</div>
                                    <div className={`text-2xl font-bold ${reqPower >= gameState.specialRequest.powerReq ? 'text-emerald-600' : 'text-amber-600'}`}>{reqPower}</div>
                                </div>
                            </div>

                            {warnings.length > 0 && (
                                <div className="px-4 py-2 bg-rose-50 border-b border-rose-200">
                                    {warnings.map((w, i) => <div key={i} className="text-xs text-rose-700 font-bold flex items-center gap-1"><AlertTriangle className="w-3 h-3" /> {w}</div>)}
                                </div>
                            )}

                            <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                {gameState.adventurers.map(adv => {
                                    const isSelected = reqParty.includes(adv.id);
                                    const canSelect = adv.loyalty >= 30;
                                    const AdvIcon = adv.advClass.icon;
                                    return (
                                        <div key={adv.id}
                                            onClick={() => canSelect && handleToggleReqParty(adv)}
                                            className={`p-3 border rounded flex justify-between items-center transition-all ${!canSelect ? 'bg-stone-100 border-stone-200 opacity-60 cursor-not-allowed' :
                                                    isSelected ? 'bg-indigo-50 border-indigo-400 cursor-pointer shadow-sm' : 'bg-white border-stone-300 hover:border-indigo-300 cursor-pointer'
                                                }`}>
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-stone-800 text-sm">{adv.name}</span>
                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded-sm font-bold border ${adv.rank === 'S' ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-stone-100 text-stone-600 border-stone-300'}`}>{adv.rank} 級</span>
                                                </div>
                                                <div className="text-[11px] font-medium flex items-center gap-1 text-indigo-700 mt-1">
                                                    <AdvIcon className="w-3 h-3" /> {adv.advClass.name} <span className="text-stone-400">|</span> <span className="text-amber-700">{adv.personality.name}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-sm font-bold text-stone-800">戦力 {adv.power}</div>
                                                <div className={`text-[10px] font-bold mt-1 ${adv.loyalty < 30 ? 'text-rose-600' : 'text-stone-500'}`}>忠誠 {adv.loyalty}% {adv.loyalty < 30 ? '(命令拒否)' : ''}</div>
                                            </div>
                                            {isSelected && <div className="absolute right-4 text-indigo-600"><CheckCircle2 className="w-5 h-5" /></div>}
                                        </div>
                                    )
                                })}
                            </div>

                            <div className="p-4 bg-stone-100 border-t border-[#D4C3A3] flex gap-3 shrink-0">
                                <button onClick={() => setReqModalOpen(false)} className="px-6 py-2 bg-stone-300 hover:bg-stone-400 text-stone-800 rounded font-bold transition-colors text-sm">キャンセル</button>
                                <button
                                    onClick={executeSpecialRequest}
                                    disabled={reqParty.length === 0}

                else if (actionModal.type === 'invest_facility') imgPath = 'assets/images/invest_facility.png';
                else if (actionModal.type === 'invest_shop') imgPath = 'assets/images/invest_shop.png';
                else if (actionModal.type === 'action_sabotage') imgPath = 'assets/images/action_sabotage.png';
                else if (actionModal.type === 'action_intelligence') imgPath = 'assets/images/action_intelligence.png';
                else if (actionModal.type === 'action_headhunt') imgPath = 'assets/images/action_headhunt.png';
                else if (actionModal.type === 'action_alliance') imgPath = 'assets/images/action_alliance.png';
                else if (actionModal.type === 'action_quest') imgPath = 'assets/images/action_quest.png';

                const isHighRank = actionModal.foundRank === 'S' || actionModal.foundRank === 'A';
                const isS = actionModal.foundRank === 'S';
                const isA = actionModal.foundRank === 'A';
                const glowClass = isS ? 'gacha-glow-s' : isA ? 'gacha-glow-a' : '';

                return (
                    <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[80] p-4 font-serif backdrop-blur-md animate-in fade-in duration-300">
                        <div className={`bg-stone-900 border-2 ${glowClass || 'border-stone-700'} rounded-sm shadow-2xl max-w-md w-full overflow-hidden relative`}>
                            {/* ② 紙吹雪エフェクト（S/Aランク発見時のみ） */}
                            {isHighRank && actionModal.phase === 'result' && <ConfettiEffect rank={actionModal.foundRank} />}
                            {/* ② 放射光エフェクト（Sランク発見時のみ） */}
                            {isS && actionModal.phase === 'result' && <div className="light-burst"></div>}

                            {imgPath && (
                                <div className="w-full h-64 overflow-hidden relative">
                                    <div className="absolute inset-0 bg-gradient-to-t from-stone-900 via-transparent to-transparent z-10"></div>
                                    <img src={imgPath} className={`w-full h-full object-cover ${actionModal.phase === 'searching' ? 'animate-pulse scale-105' : 'scale-100'} transition-transform duration-1000`} alt="" />
                                </div>
                            )}
                            <div className="p-8 text-center bg-stone-900 relative z-20">
                                {/* ② ランク輝きテキスト（S/Aランク発見時） */}
                                {isHighRank && actionModal.phase === 'result' && (
                                    <div className={`mb-4 font-black tracking-widest ${isS ? 'rank-text-s' : 'rank-text-a'}`}>
                                        ★ {isS ? 'S' : 'A'}-RANK ★
                                    </div>
                                )}
                                <p className="text-lg font-bold text-[#E8E0D5] leading-relaxed whitespace-pre-wrap">{actionModal.message}</p>
                                {actionModal.phase === 'searching' && (
                                    <div className="mt-6 flex justify-center gap-2">
                                        <div className="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style={{animationDelay: '0ms'}}></div>
                                        <div className="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style={{animationDelay: '150ms'}}></div>
                                        <div className="w-2 h-2 bg-amber-500 rounded-full animate-bounce" style={{animationDelay: '300ms'}}></div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            const bgMap = {
                home: 'assets/images/title_bg.png',
                roster: 'assets/images/bg_barracks.png',
                alignment: 'assets/images/bg_barracks.png',
                dungeons: 'assets/images/bg_dungeon.png',
                facilities: 'assets/images/bg_market.png',
                shops: 'assets/images/bg_market.png',
                intrigue: 'assets/images/bg_shadow.png',
                skills: 'assets/images/bg_throne.png',
                decision: 'assets/images/bg_throne.png',
                achievements: 'assets/images/title_bg.png',
                logs: 'assets/images/title_bg.png',
                boss: 'assets/images/bg_dungeon.png'
            };
            const currentBg = bgMap[currentView] || 'assets/images/title_bg.png';

            return (
                <div className="min-h-screen text-stone-800 font-serif flex flex-col selection:bg-amber-200">
                    <style>{`
        @keyframes shimmer {
          100% { transform: translateX(100%); }
        }
      `}</style>

                    {currentView !== 'title' && (
                        <>
                            <div className="game-bg-container">
                                <img src={currentBg} className="game-bg-img" alt="" />
                            </div>
                            <div className="game-bg-overlay"></div>
                        </>
                    )}

                    {currentView === 'title' ? (
                        <div className="min-h-screen w-full relative flex items-center justify-center overflow-hidden bg-stone-900">
                            <img src="assets/images/title_bg.png" className="absolute inset-0 w-full h-full object-cover opacity-80" alt="" />
                            <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-[2px]"></div>
                            <div className="relative z-10 flex flex-col items-center text-center p-10 bg-stone-900/60 backdrop-blur-sm border-2 border-[#D4C3A3] rounded-sm shadow-2xl max-w-xl w-full title-fade-in">
                                <Crown className="w-16 h-16 text-amber-400 mb-4 drop-shadow-lg" />
                                <h1 className="text-5xl md:text-6xl font-bold tracking-[0.2em] text-[#F2E8C6] mb-3 title-text-glow">GUILD MASTER</h1>
                                <p className="text-amber-100/80 font-medium mb-10 tracking-widest text-readable-dark">英雄の叙事詩は、ここから始まる</p>
                                <div className="w-full space-y-4">
                                    {hasSaveData && (
                                        <button onClick={() => setCurrentView('home')} className="w-full bg-indigo-700 hover:bg-indigo-600 text-white py-4 rounded-sm font-bold text-xl shadow-lg border border-indigo-900 transition-all hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                                            <RotateCcw className="w-5 h-5" /> 続きから始める
                                        </button>
                                    )}
                                    <button onClick={() => { startNewGame(); setCurrentView('home'); }} className="w-full bg-amber-700 hover:bg-amber-600 text-white py-4 rounded-sm font-bold text-xl shadow-lg border border-amber-900 transition-all hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                                        <Swords className="w-5 h-5" /> 新たな歴史を紡ぐ
                                    </button>
                                    <button onClick={() => setShowHowToPlay(true)} className="w-full bg-stone-700 hover:bg-stone-600 text-white py-4 rounded-sm font-bold text-xl shadow-lg border border-stone-900 transition-all hover:scale-[1.02] active:scale-95 flex justify-center items-center gap-2">
                                        <BookOpen className="w-5 h-5" /> 遊び方
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <>
                    <header className="bg-stone-900 text-[#E8E0D5] border-b-4 border-[#3A322C] px-6 py-4 flex items-center justify-between shrink-0 shadow-md relative z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-amber-600 p-2 rounded shadow-inner border border-amber-500">
                                <Target className="w-6 h-6 text-amber-50" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-widest text-[#F2E8C6] drop-shadow-sm">GUILD MASTER</h1>
                                <p className="text-sm text-stone-400 font-medium tracking-wider">
                                    第 {currentYear} 暦 【{currentSeason}】 / 残り {MAX_TURNS - gameState.turn} 刻
                                </p>
                            </div>
                        </div>
                        <button 
                            onClick={toggleMute}
                            className={`p-3 rounded-full transition-all active:scale-95 ${isMuted ? 'bg-stone-700 text-stone-400' : 'bg-amber-700 text-amber-50 shadow-[0_0_15px_rgba(180,130,0,0.4)]'}`}
                            title={isMuted ? "音声を有効にする" : "ミュートにする"}
                        >
                            {isMuted ? <VolumeX className="w-6 h-6" /> : <Volume2 className="w-6 h-6" />}
                        </button>
                    </header>

                    <main className="flex-1 overflow-hidden flex flex-col md:flex-row p-4 gap-6 max-w-7xl mx-auto w-full relative z-10">
                        {/* 左カラム */}
                        <div className="w-full md:w-72 flex flex-col shrink-0 gap-4 overflow-y-auto pr-1">
                            <div className="bg-stone-800 glass-panel-dark rounded-sm shadow-md border-2 border-[#D4C3A3] p-5 text-[#E8E0D5]">
                                <h2 className="text-xs font-bold text-stone-400 tracking-widest mb-4 flex items-center gap-2 border-b border-stone-700 pb-2">
                                    <Target className="w-4 h-4" /> ギルドの威信
                                </h2>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-stone-300 font-bold text-sm flex items-center gap-1.5"><Coins className="w-4 h-4 text-amber-400" /> 金庫</span>
                                        <span className={`font-bold text-lg ${gameState.budget < 0 ? 'text-rose-500' : 'text-amber-400 drop-shadow-sm'}`}>{gameState.budget.toLocaleString()} G</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-stone-300 font-bold text-sm">名声 (Fame)</span>
                                        <span className="font-bold text-lg text-indigo-300">{gameState.fame}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-stone-300 font-bold text-sm">悪名 (Notoriety)</span>
                                        <span className="font-bold text-lg text-rose-400">{gameState.notoriety}</span>
                                    </div>
                                    <div className="flex justify-between items-center pt-1">
                                        <span className="text-stone-300 font-bold text-sm">街の友好度 (Town Favor)</span>
                                        <span className={`font-bold text-lg ${gameState.townFavor >= 80 ? 'text-green-400' : gameState.townFavor >= 50 ? 'text-blue-300' : 'text-stone-400'}`}>{gameState.townFavor}</span>
                                    </div>
                                    <div className="pt-3 border-t border-stone-700 flex justify-between items-center">
                                        <span className="text-stone-100 font-bold text-sm">現在推定戦力</span>
                                        <span className="font-bold text-2xl text-amber-500 drop-shadow-md">{currentGuildPower}</span>
                                    </div>
                                    </div>
                                    </div>

                                    <nav className="bg-[#FAF8F5] glass-panel rounded-sm shadow-md border border-[#D4C3A3] overflow-hidden flex flex-col">
                                    <NavButton id="home" label="ギルド本部" icon={Home} alert={!!gameState.specialRequest} />
                                    <NavButton id="quests" label="依頼掲示板" icon={ScrollText} alert={gameState.availableQuests.length > 0} />
                                    <NavButton id="roster" label="所属冒険者名簿" icon={Users} />
                                    <NavButton id="alignment" label="運営方針" icon={Activity} />
                                    <NavButton id="dungeons" label="未踏の迷宮" icon={Compass} alert={gameState.discoveredDungeons.length > 0 && !gameState.targetDungeon} />
                                    <NavButton id="facilities" label="施設拡張" icon={Dumbbell} />
                                    <NavButton id="shops" label="外部提携" icon={ShoppingBag} />
                                    <NavButton id="intrigue" label="諜報・裏工作" icon={EyeOff} />
                                    <NavButton id="skills" label="マスターの才能" icon={Crown} />
                                    <NavButton id="achievements" label="実績一覧" icon={Trophy} />
                                    <NavButton id="logs" label="活動日誌" icon={BookOpen} />
                                    <div className="border-t border-[#D4C3A3]">
                                    <NavButton id="decision" label="大いなる決断" icon={Crown} />
                                    </div>
                                    </nav>
                            {gameState.activeBoss ? (
                                <button
                                    onClick={() => setCurrentView('boss')}
                                    className="relative overflow-hidden w-full bg-rose-900 hover:bg-rose-800 text-rose-50 px-6 py-4 rounded-sm font-bold text-lg transition-colors shadow-lg border border-rose-950 flex justify-center items-center gap-2 group shrink-0 active:scale-95 animate-pulse"
                                >
                                    <Flame className="w-5 h-5" /> 厄災迎撃戦へ
                                </button>
                            ) : (
                                <button
                                    onClick={processTurn}
                                    className="relative overflow-hidden w-full bg-indigo-900 hover:bg-indigo-800 text-indigo-50 px-6 py-4 rounded-sm font-bold text-lg transition-colors shadow-lg border border-indigo-950 flex justify-center items-center gap-2 group shrink-0 active:scale-95"
                                >
                                    <div className="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                                    <span className="relative z-10 flex items-center gap-2">季節を進める <ArrowRight className="w-5 h-5 group-hover:translate-x-1 transition-transform" /></span>
                                </button>
                            )}
                        </div>

                        {/* 右カラム */}
                        <div className="flex-1 flex flex-col bg-[#FAF8F5] glass-panel rounded-sm shadow-md border border-[#D4C3A3] overflow-hidden min-h-[500px]">
                            <div className="bg-[#E8E0D5] border-b border-[#D4C3A3] px-6 py-4 flex items-center gap-3 shrink-0">
                                <ViewHeaderIcon className="w-6 h-6 text-stone-700" />
                                <h2 className="text-lg font-bold text-stone-800 tracking-widest text-readable">{getViewTitle().title}</h2>
                            </div>
                            <div className="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-6 view-transition">
                                {renderRightPanel()}
                            </div>
                        </div>
                    </main>
                        </>
                    )}

                    {/* モーダル群 */}
                    {renderActionModal()}
                    {renderQuarterResult()}
                    {renderAdventurerModal()}
                    {renderSpecialRequestModal()}
                    {renderHowToPlayModal()}
                    {renderEnding()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
