        body {
            font-family: 'serif';
            background-color: #EBE7E0;
            margin: 0;

        /* 背景画像（ゲーム画面時に表示） */
        .game-bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .game-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.6s ease-in-out;
        }
        .game-bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(235, 231, 224, 0.65);
            backdrop-filter: blur(3px);
            z-index: 0;
            pointer-events: none;
        }

        /* すりガラス風パネル */
        .glass-panel {
            background: rgba(250, 248, 245, 0.85) !important;

        }
        .glass-panel-dark {
            background: rgba(41, 37, 36, 0.88) !important;

        /* テキストの読みやすさ向上 */
        .text-readable {

        }
        .text-readable-dark {
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        /* 画面切り替えトランジション */
        .view-transition {
            animation: fadeSlideIn 0.3s ease-out;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* タイトル画面用アニメーション */

            animation: titleFadeIn 1.2s ease-out;

            0%,

            }

        .confetti-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 30;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: confettiFall var(--duration, 3s) linear forwards;
            opacity: 0;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
        }

        /* ② ガチャ演出: 黄金グロー（S/Aランク） */
        .gacha-glow-s {
            box-shadow: 0 0 30px rgba(255, 200, 50, 0.7), 0 0 60px rgba(255, 180, 30, 0.4), inset 0 0 20px rgba(255, 200, 50, 0.15);

        @keyframes goldenPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 200, 50, 0.7), 0 0 60px rgba(255, 180, 30, 0.4); }
            50%      { box-shadow: 0 0 50px rgba(255, 200, 50, 0.9), 0 0 90px rgba(255, 180, 30, 0.6); }

        // --- Gemini Audio Engine ---
        const GeminiAudio = {
            ctx: null,
            masterGain: null,
            currentBgm: null,
            bgmLoop: null,
            isInitialized: false,

            // 周波数マップ
            notes: {
                'C2': 65.41, 'G2': 98.00, 'A2': 110.00, 'F2': 87.31, 'E2': 82.41, 'D2': 73.42,
                'A3': 220.00, 'C4': 261.63, 'E4': 329.63, 'G4': 392.00, 'B4': 493.88,
                'D4': 293.66, 'F4': 349.23, 'Ab4': 415.30, 'Bb4': 466.16
            },

            init() {
                if (this.isInitialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                    this.masterGain.gain.value = 0.3;
                    this.isInitialized = true;
                } catch (e) { console.error("Audio init failed", e); }
            },

            // シンプルなシンセ音生成
            createOsc(freq, type = 'triangle', duration = 0.5, volume = 0.2) {
                if (!this.isInitialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },

            // 効果音
            playSE(type) {
                if (!this.isInitialized || this.masterGain.gain.value === 0) return;
                switch(type) {
                    case 'click': this.createOsc(440, 'sine', 0.1, 0.1); break;
                    case 'success': 
                        this.createOsc(523.25, 'triangle', 0.3, 0.2);
                        setTimeout(() => this.createOsc(659.25, 'triangle', 0.3, 0.2), 100);
                        break;
                    case 'gacha_s':
                        [523, 659, 783, 1046].forEach((f, i) => {
                            setTimeout(() => this.createOsc(f, 'sine', 0.8, 0.1), i * 100);
                        });
                        break;
                    case 'danger': this.createOsc(110, 'sawtooth', 0.5, 0.2); break;
                }
            },

            // BGM再生
            playBGM(type) {
                if (!this.isInitialized) this.init();
                if (this.currentBgm === type) return;
                this.stopBGM();
                this.currentBgm = type;

                let step = 0;
                const sequence = this.getSequence(type);
                
                this.bgmLoop = setInterval(() => {
                    const note = sequence[step % sequence.length];
                    if (note) {
                        const freq = this.notes[note.key];
                        this.createOsc(freq, note.type || 'triangle', note.dur || 0.8, note.vol || 0.1);
                    }
                    step++;
                }, 400);
            },

            stopBGM() {
                if (this.bgmLoop) clearInterval(this.bgmLoop);
                this.currentBgm = null;
            },

            getSequence(type) {
                switch(type) {
                    case 'boss': // 緊迫感のある Dm - Eb
                        return [
                            {key:'D2', vol:0.2, type:'sawtooth'}, null, {key:'D2', vol:0.15}, {key:'Ab4', dur:0.2},
                            {key:'E2', vol:0.2, type:'sawtooth'}, null, {key:'E2', vol:0.15}, {key:'Bb4', dur:0.2}
                        ];
                    case 'ending': // 穏やかな C Major
                        return [
                            {key:'C4'}, {key:'E4'}, {key:'G4'}, {key:'C4'},
                            {key:'F4'}, {key:'A3'}, {key:'C4'}, {key:'F4'}
                        ];
                    default: // Home: 幻想的な Am
                        return [
                            {key:'A2', vol:0.2}, null, {key:'E4', dur:1.2}, null,
                            {key:'F2', vol:0.2}, null, {key:'C4', dur:1.2}, null,
                            {key:'G2', vol:0.2}, null, {key:'B4', dur:1.2}, null,
                            {key:'E2', vol:0.2}, null, {key:'G4', dur:1.2}, null
                        ];
                }
            },

            setMute(isMuted) {
                if (!this.isInitialized) this.init();
                this.masterGain.gain.setTargetAtTime(isMuted ? 0 : 0.3, this.ctx.currentTime, 0.1);
            }
        };

        const SPECIAL_REQUESTS = [

        const MASTER_SKILLS = {

        };

        const QUEST_TYPES = [
            { id: 'subjugation', name: '魔物討伐', icon: Swords, baseReward: 300, risk: 'low', favorReq: 0 },
            { id: 'escort', name: '商隊護衛', icon: Shield, baseReward: 500, risk: 'medium', favorReq: 10 },
            { id: 'investigation', name: '遺跡調査', icon: Search, baseReward: 800, risk: 'medium', favorReq: 30 },

            { id: 'emergency', name: '緊急要請', icon: AlertTriangle, baseReward: 1200, risk: 'high', favorReq: 50 }
        ];

        const SAVE_KEY = 'guildMasterSaveData_final';

        const generateQuest = (turn, favor) => {
            const type = QUEST_TYPES[Math.floor(Math.random() * QUEST_TYPES.length)];
            const level = Math.max(1, Math.floor(turn / 10) + 1);
            
            // 友好度による報酬補正 (1.0 - 1.5倍)
            const favorBonus = 1 + (favor / 200);
            
            const reward = Math.floor(type.baseReward * level * favorBonus);
            const deposit = Math.random() < 0.4 ? Math.floor(reward * 0.2) : 0; // 40%の確率で前金あり
            const powerReq = Math.floor(type.baseReward * level / 5) + (Math.random() * 50);

            return {
                id: `quest_${Math.random().toString(36).substr(2, 9)}`,
                name: `${type.name} (Lv.${level})`,
                type: type.id,
                icon: type.id,
                reward,
                deposit,
                powerReq: Math.floor(powerReq),
                desc: `${type.name}の依頼です。成功すれば街からの信頼も厚くなるでしょう。`,
                turnLimit: 4
            };
        };

        const generateReceptionist = (fame, notoriety, usedRepNames) => {
            let availableNames = REP_NAME_POOL.filter(n => !usedRepNames.includes(n));
            if (availableNames.length === 0) availableNames = REP_NAME_POOL;
            const baseName = availableNames[Math.floor(Math.random() * availableNames.length)];

            const REP_TYPES = [
                { type: 'normal', desc: '平凡な事務員。維持費が安く、堅実に仕事をこなす。', salaryBase: 100, hireBase: 100 },
                { type: 'recruiter', desc: '顔が広い元冒険者。有能な人材がギルドに加入しやすくなる。', salaryBase: 350, hireBase: 800 },
                { type: 'intelligence', desc: '裏社会の顔役。他ギルドへの工作成功率と防諜能力が劇的に上がる。', salaryBase: 500, hireBase: 1200 },
                { type: 'diplomat', desc: '交渉上手な看板娘。毎季節、他ギルドとの関係性が少しずつ改善される。', salaryBase: 400, hireBase: 1000 },
                { type: 'merchant', desc: 'やり手の商人。ギルド施設の毎季節の維持費を10%削減する。', salaryBase: 300, hireBase: 1000 }
            ];

            let availableTypes = [...REP_TYPES];
            let roll = Math.random() * 100;
            const isMiracle = roll < 5;

            let typeObj;
            if (isMiracle) {
                typeObj = availableTypes[Math.floor(Math.random() * availableTypes.length)];
            } else {
                let pool = availableTypes.filter(t => {
                    if (t.type === 'intelligence' && notoriety < 20) return false;
                    if (t.type === 'diplomat' && fame < 30) return false;
                    if (t.type === 'recruiter' && fame < 20) return false;
                    if (t.type === 'merchant' && fame < 10) return false;
                    return true;
                });
                if (pool.length === 0) pool = [availableTypes[0]];
                typeObj = pool[Math.floor(Math.random() * pool.length)];
            }

            let salary = Math.floor(typeObj.salaryBase * (0.8 + Math.random() * 0.4));
            let hireCost = Math.floor(typeObj.hireBase * (0.8 + Math.random() * 0.4));
            if (isMiracle) {
                salary = Math.floor(salary * 0.3);
                hireCost = Math.floor(hireCost * 0.5);
            }

            const prefix = isMiracle ? "訳ありの" : typeObj.type === 'normal' ? "新米の" : typeObj.type === 'intelligence' ? "影のある" : typeObj.type === 'merchant' ? "強欲な" : "熟練の";

            return {
                id: `rep_${Math.random().toString(36).substr(2, 9)}`,
                baseName: baseName,
                name: `${prefix}${baseName}`,
                type: typeObj.type,
                desc: typeObj.desc + (isMiracle ? " (訳あって格安で雇えるようだ)" : ""),
                salary,
                hireCost
            };
        };

        const generateAdventurer = (fame, notoriety, usedNames, forcedRank = null, isRecruiter = false) => {
            let availableNames = NAME_POOL.filter(n => !usedNames.includes(n));
            if (availableNames.length === 0) availableNames = NAME_POOL;
            const name = availableNames[Math.floor(Math.random() * availableNames.length)];

            let rankIdx = 0;
            let roll = Math.random() * 100;
            let qualityBonus = (fame + notoriety) / 10 + (isRecruiter ? 15 : 0);

            if (roll + qualityBonus > 95) rankIdx = 4; // A
            else if (roll + qualityBonus > 80) rankIdx = 3; // B
            else if (roll + qualityBonus > 60) rankIdx = 2; // C
            else if (roll + qualityBonus > 30) rankIdx = 1; // D
            if ((fame > 200 || isRecruiter) && Math.random() < (isRecruiter ? 0.1 : 0.05)) rankIdx = 5; // S
            if (forcedRank) rankIdx = RANKS.indexOf(forcedRank);

            const rank = RANKS[rankIdx];
            
            const RANK_STATS = [
                { powerBase: 15, powerVar: 10, salary: 50 },     // E
                { powerBase: 40, powerVar: 20, salary: 120 },    // D
                { powerBase: 100, powerVar: 50, salary: 300 },   // C
                { powerBase: 300, powerVar: 150, salary: 800 },  // B
                { powerBase: 800, powerVar: 400, salary: 2000 }, // A
                { powerBase: 1500, powerVar: 1000, salary: 6000 }// S
            ];
            
            let basePower = RANK_STATS[rankIdx].powerBase + Math.floor(Math.random() * RANK_STATS[rankIdx].powerVar);
            let salary = RANK_STATS[rankIdx].salary;

            const advClass = CLASSES[Math.floor(Math.random() * CLASSES.length)];

            let trait = TRAITS.find(t => t.id === 'normal');
            if (Math.random() < 0.5) {
                const specialTraits = TRAITS.filter(t => t.id !== 'normal');
                trait = specialTraits[Math.floor(Math.random() * specialTraits.length)];
            }

            const personality = PERSONALITIES[Math.floor(Math.random() * PERSONALITIES.length)];

            if (trait.id === 'greedy') { basePower = Math.floor(basePower * 1.3); salary = Math.floor(salary * 1.6); }
            if (trait.id === 'coward') { basePower = Math.floor(basePower * 0.7); }

            const equipment = WEAPONS[advClass.id][Math.floor(Math.random() * WEAPONS[advClass.id].length)];
            const flavor = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
            const influence = Math.floor(Math.random() * 20) + (rankIdx * 15);
            const age = Math.floor(Math.random() * 6) + 16;

            return {
                id: Math.random().toString(36).substr(2, 9),
                name, rank, advClass, trait, personality, age,
                power: basePower,
                loyalty: 80 + Math.floor(Math.random() * 20),
                salary,
                equipment,
                equippedArtifactId: null,
                flavor,
                influence,
                history: ['ギルドとの契約書に署名し、所属冒険者となった。']
            };
        };

        const generateRivals = (usedNames) => {
            const rivals = [];
            
            const RIVAL_ARCHETYPES = [
                { id: 'giant', style: 'military', namePrefix: '黄金の', nameSuffix: '獅子団', relation: 30, rankPool: ['A', 'B', 'B', 'C', 'C'] },
                { id: 'cunning', style: 'commerce', namePrefix: '漆黒の', nameSuffix: '梟', relation: 40, rankPool: ['C', 'C', 'D', 'D', 'E'] },
                { id: 'local', style: 'safety', namePrefix: '暁の', nameSuffix: '盾', relation: 60, rankPool: ['D', 'E', 'E'] }
            ];

            RIVAL_ARCHETYPES.forEach(archetype => {
                const memberCount = archetype.rankPool.length;
                const members = [];
                for (let j = 0; j < memberCount; j++) {
                    const forcedRank = archetype.rankPool[j];
                    const adv = generateAdventurer(0, 0, usedNames, forcedRank, false);
                    members.push(adv);
                    usedNames.push(adv.name);
                }
                const basePower = members.reduce((sum, m) => sum + m.power, 0) + (archetype.id === 'giant' ? 1000 : 0);

                rivals.push({
                    id: `rival_${Math.random().toString(36).substr(2, 9)}`,
                    name: `${archetype.namePrefix}${archetype.nameSuffix}`,
                    type: archetype.id,
                    style: archetype.style,
                    power: basePower,
                    members,
                    relation: archetype.relation,
                    isRevealed: false
                });
            });

            return rivals;
        };

        const INITIAL_GAME_STATE = {
            turn: 0,
            budget: 2000,
            fame: 10,
            notoriety: 0,
            townFavor: 20, // 街との友好度 (0-100)
            alignment: { safety: 25, adventure: 25, military: 25, commerce: 25 },
            facilities: { residence: 1, tavern: 1, training: 1 },
            shops: { blacksmith: 0, magicShop: 0, itemShop: 0 },
            masterSkills: { charisma: 0, underworld: 0, business: 0, leadership: 0, recruitment: 0 },
            receptionist: { id: 'rookie', name: '新米のマリー', type: 'normal', desc: '一生懸命だが不器用。維持費が安く済む。', hireCost: 0, salary: 100 },
            availableReceptionists: [],
            usedRepNames: [],
            adventurers: [],
            mainParty: [],
            activeQuests: [], // 受注中のクエスト
            availableQuests: [], // 掲示板のクエスト
            discoveredDungeons: [DUNGEON_POOL[0]],
            clearedDungeons: [],
            targetDungeon: null,
            ownedArtifacts: [],
            specialRequest: null,
            usedNames: [],
            currentEvent: null,
            currentRumor: RUMORS[0],
            rivals: [],
            unlockedAchievements: [],
            activeBoss: null,
            allianceRequests: {},
            gameOver: false,
            endType: null,
            endData: null
        };

        // パーティ戦力の相性計算ロジック
        const calculatePartyPower = (partyIds, state) => {
            if (partyIds.length === 0) return { total: 0, warnings: [] };

            const partyAdvs = state.adventurers.filter(a => partyIds.includes(a.id));
            let pCount = { hot: 0, cool: 0, ambitious: 0, gentle: 0 };
            partyAdvs.forEach(a => { pCount[a.personality.id]++; });

            let conflictHotCool = (pCount.hot > 0 && pCount.cool > 0);
            let conflictAmbitious = (pCount.ambitious > 1);
            let warnings = [];

            if (conflictHotCool) warnings.push("熱血と冷静の対立 (戦力低下)");
            if (conflictAmbitious) warnings.push("野心家の主導権争い (全体戦力低下)");

            let total = partyAdvs.reduce((sum, a) => {
                let p = a.power;
                if (state.alignment.military > 40 && a.advClass.id === 'warrior') p *= 1.2;
                if (a.equippedArtifactId) {
                    const art = ARTIFACT_POOL.find(art => art.id === a.equippedArtifactId);
                    if (art) p += art.powerBonus;
                }
                // 相性ペナルティ
                if (conflictHotCool && (a.personality.id === 'hot' || a.personality.id === 'cool')) {
                    p *= 0.8;
                }
                return sum + p;
            }, 0);

            if (conflictAmbitious) {
                total *= 0.9;
            }

            // マスターの統率力スキルボーナス
            if (state.masterSkills.leadership > 0) {
                const bonusRates = [0, 0.1, 0.2, 0.3];
                total = Math.floor(total * (1 + bonusRates[state.masterSkills.leadership]));
            }

            return { total: Math.floor(total), warnings };
        };

        function App() {
            const [gameState, setGameState] = useState(INITIAL_GAME_STATE);
            const [logs, setLogs] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);
            const [currentView, setCurrentView] = useState('title');
            const [hasSaveData, setHasSaveData] = useState(false);
            const [selectedAdv, setSelectedAdv] = useState(null);
            const [selectedCandidate, setSelectedCandidate] = useState(null);
            const [quarterResult, setQuarterResult] = useState(null);
            const [reqModalOpen, setReqModalOpen] = useState(false);
            const [reqParty, setReqParty] = useState([]);
            const [showHowToPlay, setShowHowToPlay] = useState(false);
            const [actionModal, setActionModal] = useState(null);
            const [isMuted, setIsMuted] = useState(true); // ブラウザポリシーのため初期はミュート推奨


            const toggleMute = () => {
                const nextMute = !isMuted;
                setIsMuted(nextMute);
                GeminiAudio.setMute(nextMute);
                // ミュート解除時に初期化されていなければ初期化して再生開始
                if (!nextMute && !GeminiAudio.isInitialized) {
                    GeminiAudio.init();
                    GeminiAudio.playBGM(gameState.activeBoss ? 'boss' : 'home');
                }
            };


            const logsEndRef = useRef(null);

            // ③ タイプライター演出コンポーネント
            const TypewriterText = ({ text, speed = 40, className = '', onComplete }) => {
                const [displayed, setDisplayed] = useState('');
                const [done, setDone] = useState(false);
                const indexRef = useRef(0);

                useEffect(() => {
                    setDisplayed('');
                    setDone(false);
                    indexRef.current = 0;
                    const timer = setInterval(() => {
                        indexRef.current++;
                        if (indexRef.current >= text.length) {
                            setDisplayed(text);
                            setDone(true);
                            clearInterval(timer);
                            if (onComplete) onComplete();
                        } else {
                            setDisplayed(text.slice(0, indexRef.current));
                        }
                    }, speed);
                    return () => clearInterval(timer);
                }, [text]);

                return (
                    <span className={className}>
                        {displayed}
                        {!done && <span className="typewriter-cursor"></span>}
                    </span>
                );
            };

            // ② 紙吹雪コンポーネント
            const ConfettiEffect = ({ rank }) => {
                const pieces = useRef([]);
                if (pieces.current.length === 0) {
                    const colors = rank === 'S'
                        ? ['#fbbf24', '#f59e0b', '#fcd34d', '#fff7ed', '#fef3c7', '#d97706']
                        : ['#a78bfa', '#8b5cf6', '#c4b5fd', '#e9d5ff', '#7c3aed', '#ddd6fe'];
                    const count = rank === 'S' ? 50 : 30;
                    for (let i = 0; i < count; i++) {
                        pieces.current.push({
                            id: i,
                            left: Math.random() * 100,
                            delay: Math.random() * 1.5,
                            duration: 2 + Math.random() * 2,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            size: 6 + Math.random() * 8,
                            shape: Math.random() > 0.5 ? 'circle' : 'rect',
                        });
                    }
                }
                return (
                    <div className="confetti-container">
                        {pieces.current.map(p => (
                            <div
                                key={p.id}
                                className="confetti-piece"
                                style={{
                                    left: `${p.left}%`,
                                    animationDelay: `${p.delay}s`,
                                    '--duration': `${p.duration}s`,
                                    backgroundColor: p.color,
                                    width: `${p.size}px`,
                                    height: `${p.size}px`,
                                    borderRadius: p.shape === 'circle' ? '50%' : '2px',
                                }}
                            />
                        ))}
                    </div>
                );
            };

            useEffect(() => {
                const savedData = localStorage.getItem(SAVE_KEY);
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        const loadedState = { ...INITIAL_GAME_STATE, ...parsed.gameState };

                        // マイグレーション
                        if (!loadedState.masterSkills) loadedState.masterSkills = { charisma: 0, underworld: 0, business: 0, leadership: 0 };
                        if (!loadedState.ownedArtifacts) loadedState.ownedArtifacts = [];
                        if (loadedState.specialRequest === undefined) loadedState.specialRequest = null;

                        loadedState.adventurers.forEach(a => {
                            if (!a.personality) a.personality = PERSONALITIES[Math.floor(Math.random() * PERSONALITIES.length)];
                        });

                        setGameState(loadedState);
                        setLogs(parsed.logs || []);
                        setHasSaveData(true);
                    } catch (e) {
                        setHasSaveData(false);
                    }
                } else {
                    setHasSaveData(false);
                }
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) localStorage.setItem(SAVE_KEY, JSON.stringify({ gameState, logs }));
            }, [gameState, logs, isLoaded]);

            useEffect(() => {
                if (currentView === 'logs') logsEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [logs, currentView]);

            const startNewGame = () => {
                let freshState = { ...INITIAL_GAME_STATE };
                freshState.usedNames = [];
                freshState.usedRepNames = [];

                const initialAdv = generateAdventurer(freshState.fame, freshState.notoriety, freshState.usedNames, 'D', false);
                freshState.adventurers = [initialAdv];
                freshState.mainParty = [initialAdv.id];
                freshState.usedNames.push(initialAdv.name);
                freshState.rivals = generateRivals(freshState.usedNames);
                freshState.currentRumor = RUMORS[Math.floor(Math.random() * RUMORS.length)];

                const rep1 = generateReceptionist(0, 0, freshState.usedRepNames);
                freshState.usedRepNames.push(rep1.baseName);
                const rep2 = generateReceptionist(0, 0, freshState.usedRepNames);
                freshState.usedRepNames.push(rep2.baseName);
                const rep3 = generateReceptionist(0, 0, freshState.usedRepNames);
                freshState.usedRepNames.push(rep3.baseName);
                freshState.availableReceptionists = [rep1, rep2, rep3];

                setGameState(freshState);
                setLogs([{ id: Date.now(), msg: "ギルドの扉が開かれました。30年間（120四半期）の歴史が今、始まります。", type: "info" }]);
                setCurrentView('home');
                setQuarterResult(null);
                setSelectedCandidate(null);
            };

            const resetGame = () => {
                if (window.confirm("本当にギルドを解散し、新たな歴史を始めますか？（データは全て失われます）")) {
                    localStorage.removeItem(SAVE_KEY);
                    startNewGame();
                }
            };

            const addLog = (msg, type = "normal") => {
                setLogs(prev => [...prev, { id: Date.now() + Math.random(), msg, type }]);
            };

            const toggleMainParty = () => {
                if (!selectedAdv) return;
                setGameState(prev => {
                    const isMain = prev.mainParty.includes(selectedAdv.id);
                    let nextParty = [...prev.mainParty];
                    if (isMain) {
                        nextParty = nextParty.filter(id => id !== selectedAdv.id);
                    } else {
                        if (nextParty.length >= 5) {
                            addLog("主力部隊は既に5名編成されています。", "warning");
                            return prev;
                        }
                        nextParty.push(selectedAdv.id);
                    }
                    return { ...prev, mainParty: nextParty };
                });
            };

            const autoAssembleParty = () => {
                setGameState(prev => {
                    let available = [...prev.adventurers];
                    available.sort((a, b) => b.power - a.power);
                    let nextParty = [];

                    const classes = ['warrior', 'cleric', 'mage', 'thief'];
                    classes.forEach(cls => {
                        const idx = available.findIndex(a => a.advClass.id === cls);
                        if (idx !== -1) {
                            nextParty.push(available[idx].id);
                            available.splice(idx, 1);
                        }
                    });

                    while (nextParty.length < 5 && available.length > 0) {
                        nextParty.push(available[0].id);
                        available.splice(0, 1);
                    }

                    addLog(`[人事] 冒険者の能力とクラス相性を考慮し、主力部隊を自動編成しました。`, "success");
                    return { ...prev, mainParty: nextParty };
                });
            };

            const fireAdventurer = () => {
                if (!selectedAdv) return;
                if (window.confirm(`${selectedAdv.name} をギルドから解雇しますか？\n少額の退職金(100G)を支払い、他メンバーの忠誠度が少し下がります。`)) {
                    setGameState(prev => {
                        let next = { ...prev };
                        if (next.budget < 100) {
                            addLog(`[警告] 退職金（100G）が払えないため解雇できません。`, "danger");
                            return prev;
                        }
                        next.budget -= 100;
                        next.adventurers = next.adventurers.filter(a => a.id !== selectedAdv.id);
                        next.mainParty = next.mainParty.filter(id => id !== selectedAdv.id);
                        if (selectedAdv.equippedArtifactId) {
                            next.ownedArtifacts.push(selectedAdv.equippedArtifactId);
                        }
                        next.adventurers.forEach(a => a.loyalty = Math.max(0, a.loyalty - 5));
                        addLog(`[人事] ${selectedAdv.name} を解雇しました。ギルド内に動揺が広がっています。`, "warning");
                        return next;
                    });
                    setSelectedAdv(null);
                }
            };

            const hireReceptionist = (rep) => {
                if (gameState.budget >= rep.hireCost) {
                    setActionModal({ type: 'hire_receptionist', phase: 'searching', message: '雇用条件を提示し、\n面接を行っている...' });
                    
                    setTimeout(() => {
                        setGameState(prev => {

                const newValue = parseInt(newValueStr, 10);
                setGameState(prev => {
                    let newAlign = { ...prev.alignment };
                    if (newAlign[changedId] === newValue) return prev;
                    const others = ALIGNMENTS.filter(a => a !== changedId);
                    const remaining = 100 - newValue;
                    let otherSum = others.reduce((sum, a) => sum + newAlign[a], 0);

                    let tempAlign = { [changedId]: newValue };
                    if (otherSum === 0) others.forEach(a => tempAlign[a] = remaining / 3);
                    else others.forEach(a => tempAlign[a] = (newAlign[a] / otherSum) * remaining);

                    let finalAlign = { [changedId]: newValue };
                    let currentTotal = newValue;
                    let remainders = [];

                    others.forEach(a => {
                        const intVal = Math.floor(tempAlign[a]);
                        finalAlign[a] = intVal;
                        currentTotal += intVal;
                        remainders.push({ id: a, rem: tempAlign[a] - intVal });
                    });

                    let diffTo100 = 100 - currentTotal;
                    remainders.sort((a, b) => b.rem - a.rem);
                    for (let i = 0; i < diffTo100; i++) finalAlign[remainders[i].id] += 1;

                    return { ...prev, alignment: finalAlign };
